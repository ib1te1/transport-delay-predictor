# Environment shared by the four Python services. Inside compose they
# reach each other by name; only what is published to the host changes.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-delay_predictor}:${POSTGRES_PASSWORD:-delay_predictor}@postgres:5432/${POSTGRES_DB:-delay_predictor}
  REDIS_URL: redis://redis:6379/0
  CONFIG_PATH: /config/system.yaml
  DATA_DIR: /data

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

x-backend: &backend
  environment: *backend-env
  volumes:
    # Read-only and outside the image: editing system.yaml needs a
    # restart, not a rebuild. The dataset is mounted, never baked in.
    - ./config:/config:ro
    - ./data/dataset:/data:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    seed:
      condition: service_completed_successfully
  healthcheck: *backend-healthcheck

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delay_predictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delay_predictor}
      POSTGRES_DB: ${POSTGRES_DB:-delay_predictor}
    # Never beyond localhost, on the stand included. The host port is
    # configurable because a local Postgres on 5432 is common.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delay_predictor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tag pinned to the 7.2 branch on purpose: it is the last one released
  # under BSD-3-Clause. The floating "7" tag resolves to 7.4+, which is
  # dual RSALv2/SSPLv1. See docs/third-party.md — the declared license
  # must match the tag that actually runs.
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations and exits. Everything that touches the database
  # waits for it, so migrations never run twice at once.
  migrate:
    build: ./migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delay_predictor}:${POSTGRES_PASSWORD:-delay_predictor}@postgres:5432/${POSTGRES_DB:-delay_predictor}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Loads the demo period's planned stops and terminal ids, then exits.
  # Runs from the api image: the loader is api code.
  seed:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "app.seed"]
    environment: *backend-env
    volumes:
      - ./config:/config:ro
      - ./data/dataset:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  ingest:
    <<: *backend
    image: transport-delay-predictor-ingest:local
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    # Debug access only, always local.
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:${NDTP_HOST_PORT:-9201}:9201"

  # Replay is deliberately opt-in: compose up must not restart the dataset
  # clock at the beginning of the file after every service restart.
  replay:
    <<: *backend
    profiles: ["replay"]
    image: transport-delay-predictor-ingest:local
    command: ["python", "-m", "app.replay"]
    healthcheck:
      disable: true
    restart: "no"

  # Load the supplied image separately with docker load. Its REST config
  # points at ingest:9201 on the same compose network.
  emulator:
    image: ndtp-telemetry-emulator:1.0
    profiles: ["emulator"]
    depends_on:
      ingest:
        condition: service_started
    ports:
      - "127.0.0.1:18080:18080"

  matcher:
    <<: *backend
    build:
      context: .
      dockerfile: services/matcher/Dockerfile
    ports:
      - "127.0.0.1:8002:8000"

  # Does not need reference data, so it does not wait for seed: a bad
  # dataset row must never block the ML service from starting.
  predictor:
    <<: *backend
    build:
      context: .
      dockerfile: services/predictor/Dockerfile
    environment:
      <<: *backend-env
      MODEL_DIR: /models/current
    volumes:
      - ./config:/config:ro
      - ./data/dataset:/data:ro
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8003:8000"
    # Longer start_period than the rest: importing CatBoost is the slow
    # part of this service's startup.
    healthcheck:
      <<: *backend-healthcheck
      start_period: 40s

  # Does not wait for predictor: the dashboard has to work without a
  # model, and a predictor that fails at startup must not keep the API
  # down.
  api:
    <<: *backend
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *backend-env
      PREDICTOR_URL: http://predictor:8000
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"

  # VITE_API_URL is read by the browser, not by this container, so it is
  # the address the viewer's machine reaches api at. The Vite dev server
  # needs nothing from api to start, hence service_started.
  web:
    build: ./web
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"

volumes:
  pgdata:
